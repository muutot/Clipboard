name: CI

on:
  push:
    # Every branch, so release branches and forks are validated too. The
    # paths-ignore below is the only filter, which keeps the two concerns in
    # one place instead of a branch list that silently rots.
    branches: ["**"]
    # Only pure-documentation changes skip CI. Dependency and version
    # manifests MUST still run clippy/tests/build - an upgrade commit that
    # skips CI would only be validated at the next code change or release.
    paths-ignore:
      - CHANGELOG.md
      - RELEASE.md
  pull_request:

jobs:
  glibc-compat:
    name: Linux compatibility ABI
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: bash scripts/test-glibc-compat.sh

  frontend:
    name: Frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          # setup-node's built-in npm cache (keyed on package-lock.json)
          # replaces a separate node_modules cache; `npm ci` reinstalls
          # node_modules every run anyway.
          cache: npm

      - name: Install dependencies
        run: npm ci

      - run: npm run format:check

      - run: npm run test

      - run: node --test scripts/test-release-identity.mjs

      - run: npm run check

      - run: npm run build

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev libgtk-3-dev libdbus-1-dev \
            libjavascriptcoregtk-4.1-dev libsoup-3.0-dev mold

      - name: Configure linker (Linux)
        if: runner.os == 'Linux'
        run: echo "RUSTFLAGS=-C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
          # Cache key already covers RUSTFLAGS/CARGO_* via the default
          # `env-vars` prefixes (RUST, CARGO, ...); the `env-cache-key` input
          # we used to pass here does not exist and was silently ignored.
          # This input is a boolean, not a list of profile directories.
          cache-targets: true

      - name: Check formatting
        # --all covers every workspace member (e.g. crates/clipboard-sync),
        # not just the root package.
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Clippy
        run: cargo clippy --profile ci --manifest-path src-tauri/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Install nextest
        uses: taiki-e/install-action@6cd13508893c0e7eab5f273c2575d3859bd7229a # v2
        with:
          tool: cargo-nextest

      - name: Test
        env:
          # `read_clipboard_file_paths_reads_a_cf_hdrop` empties and rewrites the
          # real system clipboard. That is harmless on a headless CI runner, but
          # it would destroy a developer's clipboard under `npm run verify` or
          # `ci:local`, so the test only runs when this opt-in is set. The test
          # is `cfg(target_os = "windows")`, so only the Windows runner enables it.
          CLIPBOARD_ALLOW_REAL_CLIPBOARD_TEST: ${{ runner.os == 'Windows' && '1' || '' }}
        run: cargo nextest run --cargo-profile ci --manifest-path src-tauri/Cargo.toml --workspace
