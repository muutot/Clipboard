name: CI

on:
  push:
    # Every branch, so release branches and forks are validated too. The
    # paths-ignore below is the only filter, which keeps the two concerns in
    # one place instead of a branch list that silently rots.
    branches: ["**"]
    # Only pure-documentation changes skip CI. Dependency and version
    # manifests MUST still run clippy/tests/build - an upgrade commit that
    # skips CI would only be validated at the next code change or release.
    paths-ignore:
      - CHANGELOG.md
      - RELEASE.md
  pull_request:

jobs:
  glibc-compat:
    name: Linux compatibility ABI
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: bash scripts/test-glibc-compat.sh

  frontend:
    name: Frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The suite takes 1-2 min; the cap only exists so a hung test fails the job
    # instead of holding it for the 6 h default and leaving the run `in_progress`.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          # setup-node's built-in npm cache (keyed on package-lock.json)
          # replaces a separate node_modules cache; `npm ci` reinstalls
          # node_modules every run anyway.
          cache: npm

      - name: Install dependencies
        run: npm ci

      - run: npm run format:check

      - run: npm run test

      - run: node --test scripts/test-release-identity.mjs

      - run: npm run check

      - run: npm run build

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # Only used by the clippy failure fingerprint step below.
      statuses: write
    # 4-11 min with a warm cache. Same reason as the frontend cap: a test that
    # parks in `accept()` must fail the job, not stall it for hours.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev libgtk-3-dev libdbus-1-dev \
            libjavascriptcoregtk-4.1-dev libsoup-3.0-dev mold

      - name: Configure linker (Linux)
        if: runner.os == 'Linux'
        run: echo "RUSTFLAGS=-C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
          # Cache key already covers RUSTFLAGS/CARGO_* via the default
          # `env-vars` prefixes (RUST, CARGO, ...); the `env-cache-key` input
          # we used to pass here does not exist and was silently ignored.
          # This input is a boolean, not a list of profile directories.
          cache-targets: true

      # `ort-sys` downloads its prebuilt ONNX Runtime into a per-user cache
      # directory and bakes that absolute path into the build script output.
      # The output rides inside `target/`, which the Rust cache restores, but
      # the referenced directory does not — so a fresh runner replays a still
      # "fresh" build script that points at a path which does not exist, and
      # only the test link fails (`could not find native static library
      # onnxruntime`). Dropping the crate's artifacts makes the script run
      # again and fetch (or reuse) the binaries before anything links.
      - name: Refresh the ONNX Runtime link
        run: cargo clean -p ort-sys --profile ci --manifest-path src-tauri/Cargo.toml

      - name: Check formatting
        # --all covers every workspace member (e.g. crates/clipboard-sync),
        # not just the root package.
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Clippy
        shell: bash
        run: |
          # Tee so a failure can be surfaced through the statuses API: the
          # maintainer may not be able to open the Actions web log from every
          # environment (same constraint as the sync-s3.yml fingerprint). A
          # killed run (OOM, full disk) leaves no error line, so the exit code
          # and disk headroom are recorded next to the log.
          code=0
          cargo clippy --profile ci --manifest-path src-tauri/Cargo.toml \
            --workspace --all-targets -- -D warnings 2>&1 |
            tee "$RUNNER_TEMP/clippy.log" || code=$?
          {
            echo "clippy_exit=$code"
            echo "disk_free=$(df -h . | tail -n1 | tr -s ' ' | cut -d' ' -f4)"
            echo "log_bytes=$(wc -c <"$RUNNER_TEMP/clippy.log")"
          } >>"$RUNNER_TEMP/clippy.log"
          exit "$code"

      - name: Surface clippy failure fingerprint
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/clippy.log"
          fingerprint="clippy failed without a captured log"
          if [ -f "$log" ]; then
            line="$(grep -m1 -E '^error' "$log" | cut -c1-100 || true)"
            if [ -n "$line" ]; then
              fingerprint="$line"
            else
              # No diagnostic line: report how the run died instead.
              detail="$(grep -E 'clippy_exit|disk_free|log_bytes' "$log" | tr '\n' ' ' | cut -c1-100 || true)"
              fingerprint="no error line; ${detail:-empty log}"
            fi
          fi
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=failure \
            -f context=ci-clippy-diagnostics \
            -f description="$fingerprint" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            >/dev/null
          echo "fingerprint: $fingerprint"

      - name: Install nextest
        uses: taiki-e/install-action@6cd13508893c0e7eab5f273c2575d3859bd7229a # v2
        with:
          tool: cargo-nextest

      - name: Test
        env:
          # `read_clipboard_file_paths_reads_a_cf_hdrop` empties and rewrites the
          # real system clipboard. That is harmless on a headless CI runner, but
          # it would destroy a developer's clipboard under `npm run verify` or
          # `ci:local`, so the test only runs when this opt-in is set. The test
          # is `cfg(target_os = "windows")`, so only the Windows runner enables it.
          CLIPBOARD_ALLOW_REAL_CLIPBOARD_TEST: ${{ runner.os == 'Windows' && '1' || '' }}
        run: cargo nextest run --cargo-profile ci --manifest-path src-tauri/Cargo.toml --workspace
