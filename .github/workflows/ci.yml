name: CI

on:
  push:
    branches: [core]
    paths-ignore:
      - package.json
      - src-tauri/tauri.conf.json
      - src-tauri/Cargo.toml
      - src-tauri/Cargo.lock
      - CHANGELOG.md
      - RELEASE.md
  pull_request:
    branches: [master]

jobs:
  frontend:
    name: Frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node24-

      - name: Install dependencies
        run: npm install --frozen-lockfile

      - run: npm run format:check

      - run: npm run check

      - run: npm run build

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev libsoup-3.0-dev mold

      - name: Configure linker (Linux)
        if: runner.os == 'Linux'
        run: echo "RUSTFLAGS=-C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          env-cache-key: RUSTFLAGS
          cache-on-failure: true
          # CI only ever builds the `ci` profile (clippy/test), never `release`,
          # so caching just those target dirs keeps the cache entry small and fast.
          cache-targets: |
            debug
            ci

      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Clippy
        run: cargo clippy --profile ci --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Test
        run: cargo nextest run --cargo-profile ci --manifest-path src-tauri/Cargo.toml
