name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 0.2.0)"
        required: true
        type: string

# Read-only by default; only the build job (which publishes the release)
# gets contents:write. A compromised verify job then cannot touch releases.
permissions:
  contents: read

jobs:
  resolve:
    name: Resolve release commit
    runs-on: ubuntu-latest
    # Tag validation is a couple of git/node calls; the cap only exists so a
    # hung step fails the job instead of stalling the run for the 6 h default.
    timeout-minutes: 10
    outputs:
      release_tag: ${{ steps.identity.outputs.release_tag }}
      release_sha: ${{ steps.identity.outputs.release_sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
      - name: Validate and resolve release tag
        id: identity
        run: node scripts/validate-release-version.mjs --resolve
        env:
          GITHUB_EVENT_INPUTS_VERSION: ${{ inputs.version }}

  verify:
    name: Verify
    needs: resolve
    runs-on: ubuntu-latest
    # Same rationale as the CI caps: a hung step must fail the job, not stall
    # the run for hours.
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
      RELEASE_SHA: ${{ needs.resolve.outputs.release_sha }}
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.resolve.outputs.release_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: npm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          # env-vars defaults to "CARGO CC CFLAGS CXX CMAKE RUST" prefixes,
          # which already covers RUSTFLAGS and the CARGO_PROFILE_* knobs this
          # workflow sets; the `env-cache-key` input we used to pass does not
          # exist and was silently ignored.
          # Keep the cache even when a check or test fails so a follow-up run
          # does not start from a cold dependency graph.
          cache-on-failure: true

      # See the CI note on `ort-sys`: its cached build script output points at
      # a download directory the fresh runner does not have, so it must be
      # regenerated before anything links.
      - name: Refresh the ONNX Runtime link
        run: cargo clean -p ort-sys --manifest-path src-tauri/Cargo.toml

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev libgtk-3-dev libdbus-1-dev \
            libjavascriptcoregtk-4.1-dev libsoup-3.0-dev mold

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

  build:
    name: Build (${{ matrix.platform }})
    # Runs in parallel with verify, not after it: the fat-LTO build dominates
    # the release wall clock, so gate only publish on verify success instead of
    # making every build leg wait ~45 minutes of verification first. An
    # unverified build costs runner minutes; an unverified *publish* would ship
    # a broken release, and publish below still needs verify.
    needs: [resolve]
    runs-on: ${{ matrix.runner }}
    # The extreme LTO build is the longest step of the release; the cap exists
    # so a hung toolchain fails the job instead of stalling it for hours.
    timeout-minutes: 120
    permissions:
      contents: write
      # The SignPath signing action downloads the workflow artifact that
      # carries the unsigned installer (see the signing steps below).
      actions: read
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
      RELEASE_SHA: ${{ needs.resolve.outputs.release_sha }}
      # Gate for the optional SignPath signing steps: unset while SignPath
      # Foundation onboarding is pending, so releases stay unsigned and green.
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      CARGO_PROFILE_RELEASE_LTO: "true"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "3"
      RUSTFLAGS: ${{ matrix.rustflags }}
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            rustflags: -C target-cpu=x86-64-v3
          - platform: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            # ring 0.17.x has a `const` assertion in cpu/arm/darwin.rs that
            # requires the detected target features to EXACTLY equal its
            # hardcoded baseline. `-C target-cpu=native` enables extra Apple
            # Silicon features (lse/rdm/dotprod/...), breaking that assertion
            # and panicking at compile time. Leave RUSTFLAGS empty so rustc
            # uses the aarch64-apple-darwin baseline the crate expects.
            rustflags: ""
          - platform: linux-x64
            # Pinned, not ubuntu-latest (24.04, glibc 2.39): binaries linked
            # there require GLIBC_2.38/2.39 symbols and die at startup on the
            # 22.04-based firejail sandbox the appimage.github.io catalog test
            # uses (run 36652919185: "version `GLIBC_2.39' not found"). 22.04's
            # glibc 2.35 keeps the artifacts compatible with 2.35+.
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rustflags: -C target-cpu=x86-64-v3 -C link-arg=-fuse-ld=mold

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.resolve.outputs.release_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: npm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          # See the verify job's rust-cache note: RUSTFLAGS and the
          # CARGO_PROFILE_* env vars are already part of the default key.
          # Fat-LTO release artifacts per platform can be large; if the cache
          # entry exceeds GitHub's 10GB limit the upload is skipped but the job
          # still passes.
          cache-on-failure: true

      # See the CI note on `ort-sys`: its cached build script output points at
      # a download directory the fresh runner does not have, so it must be
      # regenerated before the bundle links.
      - name: Refresh the ONNX Runtime link
        run: cargo clean -p ort-sys --profile release --manifest-path src-tauri/Cargo.toml

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev libgtk-3-dev libdbus-1-dev \
            libjavascriptcoregtk-4.1-dev libsoup-3.0-dev mold

      - name: Install dependencies
        run: npm ci

      - name: Prepare release body
        id: release_body
        shell: bash
        run: |
          if [ -f RELEASE.md ]; then
            echo "body<<BODY_EOF" >> "$GITHUB_OUTPUT"
            cat RELEASE.md >> "$GITHUB_OUTPUT"
            echo "BODY_EOF" >> "$GITHUB_OUTPUT"
          else
            echo "body=See CHANGELOG.md for details." >> "$GITHUB_OUTPUT"
          fi

      # tauri-bundler stores the AppImage launcher it downloads (AppRun, which
      # linuxdeploy renames to AppRun.wrapped) with mode 770, so only its owner
      # and group may run it. Files belong to whoever starts an AppImage, so
      # this is invisible locally, but root-mounted sandboxes that run it as
      # another user — firejail, the appimage.github.io catalog test — die with
      # "AppRun.wrapped: Permission denied" (tauri-apps/tauri#16155). Seeding
      # the bundler's cache with a 755 copy fixes it: the bundler only
      # downloads when the file is missing and `fs::copy` keeps the mode.
      - name: Seed AppImage launcher with mode 755
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          dir="${XDG_CACHE_HOME:-$HOME/.cache}/tauri"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/AppRun-x86_64" \
            "https://github.com/tauri-apps/binary-releases/releases/download/apprun-old/AppRun-x86_64"
          echo "f30140a43a0a59e46db21bdefdf749b9e9f2c6946e92afabbacf98b8ae73fb4f  $dir/AppRun-x86_64" | sha256sum -c -
          chmod 755 "$dir/AppRun-x86_64"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "v__VERSION__"
          releaseBody: ${{ steps.release_body.outputs.body }}
          # Draft until every matrix leg has succeeded: `build` fans out to
          # three independent legs, so a non-draft release would be published
          # from whichever legs finished first. The `publish` job below is the
          # single writer that flips it live.
          releaseDraft: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          args: ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }}

      # Authenticode-sign the NSIS installer through SignPath Foundation (free
      # code signing for open source). Gated on SIGNPATH_API_TOKEN so the flow
      # stays a no-op until onboarding completes. The signing request blocks
      # until a maintainer approves it in the SignPath console — that human
      # approval is part of the Foundation's per-release policy. The signed
      # file replaces the draft asset BEFORE checksums run, so checksums-
      # windows-x64.txt matches what users actually download.
      - name: Upload unsigned installer for signing
        id: signable_installer
        if: runner.os == 'Windows' && env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-windows-installer
          if-no-files-found: error
          path: src-tauri/target/*/release/bundle/nsis/*-setup.exe

      - name: Sign installer via SignPath
        id: signpath
        if: runner.os == 'Windows' && env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: clipboard
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.signable_installer.outputs.artifact-id }}
          output-artifact-directory: signed-installer
          skip-decompress: true
          wait-for-completion-timeout-in-seconds: "3600"

      - name: Verify and publish signed installer
        if: runner.os == 'Windows' && env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = @(Get-ChildItem 'src-tauri/target/*/release/bundle/nsis/*-setup.exe' -File)
          if ($installer.Count -ne 1) { throw "expected exactly one installer, found $($installer.Count)" }
          $signed = @(Get-ChildItem 'signed-installer' -File)
          if ($signed.Count -ne 1) { throw "SignPath returned $($signed.Count) files, expected 1" }
          $signature = Get-AuthenticodeSignature $signed[0].FullName
          if ($signature.Status -ne 'Valid') {
            throw "signed installer signature is $($signature.Status)"
          }
          Move-Item $signed[0].FullName $installer[0].FullName -Force
          gh release upload "$env:RELEASE_TAG" "$($installer[0].FullName)" --clobber --repo "$env:GITHUB_REPOSITORY"
          Write-Output "Published signed installer $($installer[0].Name)"
          Write-Output "SignPath request: ${{ steps.signpath.outputs.signing-request-web-url }}"
          Write-Output "Publisher: $($signature.SignerCertificate.Subject)"

      # The bundler's linuxdeploy/appimagetool toolchain (all moving targets:
      # tauri-apps binary-releases + the plugin's "continuous" tag) leaves
      # directories inside the squashfs without other-rx (run 36535865624:
      # every directory flagged, no files), which blocks non-owner users the
      # same way the 0770 AppRun did. Normalize the modes and repack with a
      # pinned appimagetool, then replace the draft-release asset that
      # tauri-action already uploaded.
      - name: Repair AppImage modes and repack
        id: appimage_repack
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          appimage=$(find src-tauri/target -type f -name '*.AppImage' \
            -not -path '*/deps/*' -not -path '*/build/*' -print -quit)
          test -n "$appimage" || { echo "no AppImage was built"; exit 1; }
          appimage="$PWD/$appimage"
          work="$(mktemp -d)"
          (cd "$work" && "$appimage" --appimage-extract >/dev/null) || {
            echo "::error::could not extract $appimage"; exit 1; }
          # a+rX: read for everyone; execute on directories and on files that
          # are already executable for their owner; drop group/other write.
          chmod -R a+rX,go-w "$work/squashfs-root"
          curl -fsSL --retry 3 -o "$work/appimagetool.AppImage" \
            "https://github.com/AppImage/AppImageKit/releases/download/13/obsolete-appimagetool-x86_64.AppImage"
          echo "df3baf5ca5facbecfc2f3fa6713c29ab9cefa8fd8c1eac5d283b79cab33e4acb  $work/appimagetool.AppImage" | sha256sum -c -
          chmod +x "$work/appimagetool.AppImage"
          "$work/appimagetool.AppImage" --appimage-extract-and-run \
            "$work/squashfs-root" "$appimage"
          rm -rf "$work"
          echo "appimage=$appimage" >> "$GITHUB_OUTPUT"

      - name: Upload repacked AppImage
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" "${{ steps.appimage_repack.outputs.appimage }}" --clobber \
            --repo "$GITHUB_REPOSITORY"
          echo "Repacked $(basename "${{ steps.appimage_repack.outputs.appimage }}") with normalized modes and replaced the draft asset."

      # Gate, not just the fix above: fail the build if any file in the
      # AppImage is still limited to its owner or group, so the defect can
      # never ship silently even if the bundler changes where it puts the
      # launcher. Fails before checksums, leaving the draft release incomplete.
      - name: Check AppImage file modes
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          appimage=$(find src-tauri/target -type f -name '*.AppImage' \
            -not -path '*/deps/*' -not -path '*/build/*' -print -quit)
          test -n "$appimage" || { echo "no AppImage was built"; exit 1; }
          # Absolutize with pwd, not realpath: realpath has failed with
          # "No such file or directory" on a path find itself just listed
          # (run 36531684969), and the bundler also writes lower/upper-case
          # variants of the same name, so trust nothing exotic here.
          appimage="$PWD/$appimage"
          ls -la "$(dirname "$appimage")"
          chmod +x "$appimage"
          work="$(mktemp -d)"
          (cd "$work" && "$appimage" --appimage-extract >/dev/null) || {
            echo "::error::could not extract $appimage"; exit 1; }
          # Every file readable by everyone, executable wherever its owner can
          # execute it, and every directory openable and traversable by all.
          bad="$(cd "$work/squashfs-root" && find . \
            \( -type f \( ! -perm -o+r -o \( -perm -u+x ! -perm -o+x \) \) \) \
            -o \( -type d ! -perm -o+rx \) | sort)"
          if [ -n "$bad" ]; then
            echo "::error::$(basename "$appimage"): files only their owner or group can use; root-mounted sandboxes running as another user get Permission denied"
            printf '%s\n' "$bad"
            printf '%s\n' "$bad" | head -5 | while IFS= read -r p; do
              stat -c '%A %n' "$work/squashfs-root/$p" || true
            done
            rm -rf "$work"
            exit 1
          fi
          rm -rf "$work"
          echo "All AppImage files are readable/executable by every user."

      # Publish SHA-256 checksums alongside the artifacts so downloads can be
      # verified independently of the release asset itself. Per-platform file
      # names avoid concurrent jobs clobbering each other.
      - name: Upload checksums
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
        run: |
          set -euo pipefail
          out="checksums-${{ matrix.platform }}.txt"
          # Basenames only: a downloader has the file, not the runner-relative
          # path, so `sha256sum -c` must not be handed a path it cannot resolve.
          # `-r` keeps an empty result from producing an empty-but-valid file.
          find src-tauri/target -type f \( \
            -name '*.msi' -o -name '*-setup.exe' -o -name '*.dmg' -o \
            -name '*.app.tar.gz' -o -name '*.AppImage' -o \
            -name '*.deb' -o -name '*.rpm' \) \
            -not -path '*/deps/*' -not -path '*/build/*' -print0 \
          | xargs -0 -r sha256sum \
          | sed 's|  .*/|  |' > "$out"
          sort -k2 -u -o "$out" "$out"
          test -s "$out" || { echo "no artifacts to checksum"; exit 1; }
          cat "$out"
          gh release upload "$RELEASE_TAG" "$out" --clobber --repo "$GITHUB_REPOSITORY"

  publish:
    name: Publish release
    # Release creation plus asset upload/GitCode sync; a hung request must
    # fail the job instead of stalling the run for the 6 h default.
    timeout-minutes: 20
    # verify is needed here even though build no longer depends on it: build
    # and verify run in parallel, so without this a verify failure would not
    # stop the draft release from being published.
    needs: [resolve, verify, build]
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The only step that makes a release visible, and it runs only after every
      # platform leg has succeeded. A partial matrix therefore leaves a draft
      # behind for inspection instead of a published release that silently lacks
      # a platform.
      - name: Publish the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
        run: |
          set -euo pipefail
          # GitHub refuses `make_latest` for a draft or a prerelease
          # ("Drafts and prereleases cannot be set as latest"), so asking for
          # `--latest` on a prerelease tag rejects the whole PATCH with a 422
          # and leaves the release a draft forever, with every artifact
          # uploaded but invisible. Only a full release may become "latest".
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --repo "$GITHUB_REPOSITORY"
          else
            gh release edit "$RELEASE_TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
          fi
