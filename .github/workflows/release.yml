name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 0.2.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node24-

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          env-cache-key: RUSTFLAGS
          # The extreme release build (fat LTO, codegen-units=1) can push target/
          # past GitHub's 10GB cache-entry limit. cache-on-failure keeps the job
          # green even if the cache upload is refused; the build still succeeds.
          cache-on-failure: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev libsoup-3.0-dev mold

      - name: Install dependencies
        run: npm install --frozen-lockfile

      - name: Verify
        run: npm run verify

      - name: Verify extreme release build
        env:
          CARGO_PROFILE_RELEASE_LTO: "true"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "3"
        run: cargo build --profile release --manifest-path src-tauri/Cargo.toml

  build:
    name: Build (${{ matrix.platform }})
    needs: verify
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_PROFILE_RELEASE_LTO: "true"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "3"
      RUSTFLAGS: ${{ matrix.rustflags }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            rustflags: -C target-cpu=x86-64-v3
          - platform: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            # ring 0.17.x has a `const` assertion in cpu/arm/darwin.rs that
            # requires the detected target features to EXACTLY equal its
            # hardcoded baseline. `-C target-cpu=native` enables extra Apple
            # Silicon features (lse/rdm/dotprod/...), breaking that assertion
            # and panicking at compile time. Leave RUSTFLAGS empty so rustc
            # uses the aarch64-apple-darwin baseline the crate expects.
            rustflags: ""
          - platform: linux-x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            rustflags: -C target-cpu=x86-64-v3 -C link-arg=-fuse-ld=mold

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node24-

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          env-cache-key: CARGO_PROFILE_RELEASE_OPT_LEVEL CARGO_PROFILE_RELEASE_LTO CARGO_PROFILE_RELEASE_CODEGEN_UNITS RUSTFLAGS
          # Fat-LTO release artifacts per platform can be large; if the cache
          # entry exceeds GitHub's 10GB limit the upload is skipped but the job
          # still passes.
          cache-on-failure: true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev libsoup-3.0-dev mold

      - name: Install dependencies
        run: npm install --frozen-lockfile

      - name: Prepare release body
        id: release_body
        shell: bash
        run: |
          if [ -f RELEASE.md ]; then
            echo "body<<BODY_EOF" >> "$GITHUB_OUTPUT"
            cat RELEASE.md >> "$GITHUB_OUTPUT"
            echo "BODY_EOF" >> "$GITHUB_OUTPUT"
          else
            echo "body=See CHANGELOG.md for details." >> "$GITHUB_OUTPUT"
          fi

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "v__VERSION__"
          releaseBody: ${{ steps.release_body.outputs.body }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }}
