name: Sync to GitCode

# Manually triggered: run this after a release is published to mirror the GitHub
# Release body + assets to GitCode. Decoupled from the Release workflow by design.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sync (e.g., v1.7.1)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  sync-gitcode:
    name: Sync to GitCode
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install sync dependencies
        run: pip install requests tqdm

      # Mirrors the published GitHub Release body + assets to GitCode.
      # Requires repo secrets GITCODE_TOKEN (GitCode personal access token),
      # GITCODE_OWNER and GITCODE_REPO (target GitCode coordinates).
      - name: Sync release to GitCode
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          GITCODE_OWNER: ${{ secrets.GITCODE_OWNER }}
          GITCODE_REPO: ${{ secrets.GITCODE_REPO }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SYNC_TAG: ${{ inputs.tag }}
        run: python scripts/sync_release.py
