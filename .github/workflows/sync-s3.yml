# Real-S3 sync smoke matrix
#
# The sync engine's transport contract (SigV4 signing, path-style addressing,
# conditional writes, ETag quoting, LIST continuation) can only be proven
# against a real S3-compatible server; `MemoryStore` covers engine semantics
# but not the wire. CI previously ran no real server, so the ignored test list
# could rot between manual runs.
#
# Server choice: pinned rustfs, the same server family the local
# `scripts/sync-s3-test.ps1` path provisions, downloaded from the release and
# verified against the upstream SHA256SUMS before it runs. A first attempt used
# a pinned MinIO docker container and never passed the readiness probe; the
# rustfs path is the one with documented smoke evidence (`docs/SYNC_V1.md`),
# needs no docker daemon, and its asset is pinned plus checksum-verified. Only
# ubuntu runs here (the pinned asset is linux-x86_64-musl); windows/macos have
# no equivalent release asset pinned and the ps1 script remains the local
# Windows path.
#
# The scale benchmarks stay opt-in: they need a release-mode runtime and are
# not part of this gate. Scope and acceptance criteria: `docs/SYNC_V2.md`
# (V2-2).

name: Sync S3 smoke

on:
  push:
    # Same philosophy as CI: every branch (release branches included) is
    # validated on push, filtered to the sync paths plus this file.
    paths:
      - "src-tauri/src/sync/**"
      - "src-tauri/crates/clipboard-sync/**"
      - ".github/workflows/sync-s3.yml"
  pull_request:
    paths:
      - "src-tauri/src/sync/**"
      - "src-tauri/crates/clipboard-sync/**"
      - ".github/workflows/sync-s3.yml"
  schedule:
    # Weekly Monday 03:17 UTC: a quiet slot that still re-proves the wire
    # contract when no sync change lands.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  # Only used by the diagnostic status step below.
  statuses: write

jobs:
  smoke:
    name: Real S3 smoke
    runs-on: ubuntu-latest
    # Provisioning plus a cold-profile build; the smoke suite itself is ~10s.
    # Same rationale as the CI caps: a hung step must fail the job, not stall.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install Linux system dependencies
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev libgtk-3-dev libdbus-1-dev \
            libjavascriptcoregtk-4.1-dev libsoup-3.0-dev mold unzip

      - name: Configure linker (Linux)
        run: echo "RUSTFLAGS=-C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
          cache-targets: true

      # Same reason as the main CI: a restored `target/` can reference an
      # onnxruntime cache path the runner does not have, so the build script
      # must re-run before anything links.
      - name: Refresh the ONNX Runtime link
        run: cargo clean -p ort-sys --profile ci --manifest-path src-tauri/Cargo.toml

      # One step on purpose: provisioning, the server, and the tests share a
      # process lifetime. A server started in an earlier step depends on
      # background-process survival across steps, which the runner does not
      # guarantee; here the EXIT trap always stops rustfs.
      - name: Provision rustfs and run real-S3 smokes
        env:
          RUSTFS_VERSION: "1.0.1"
          RUSTFS_ASSET: "rustfs-linux-x86_64-musl-v1.0.1.zip"
          CLIPBOARD_S3_TEST_ENDPOINT: http://127.0.0.1:9000
          CLIPBOARD_S3_TEST_REGION: us-east-1
          CLIPBOARD_S3_TEST_BUCKET: clipboard-sync-ci-smoke
          CLIPBOARD_S3_TEST_ACCESS_KEY: clipboard-ci
          CLIPBOARD_S3_TEST_SECRET_KEY: clipboard-ci-secret-0123456789
          CLIPBOARD_S3_TEST_PASSWORD: clipboard-ci-sync-password
        run: |
          set -euo pipefail
          status=0
          tools="$RUNNER_TEMP/rustfs"
          data="$RUNNER_TEMP/rustfs-data"
          server_log="$RUNNER_TEMP/rustfs-server.log"
          smoke_log="$RUNNER_TEMP/rustfs-smoke.log"
          mkdir -p "$tools" "$data"
          # Marker first: a step that dies before cargo leaves only this line,
          # which tells the diagnostic status apart from a real test failure.
          echo "provisioning" >"$smoke_log"
          cleanup() {
            if [ -n "${server_pid:-}" ]; then
              kill "$server_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          echo "== provisioning pinned rustfs $RUSTFS_VERSION =="
          base="https://github.com/rustfs/rustfs/releases/download/$RUSTFS_VERSION"
          curl -fsSL --retry 3 --retry-delay 2 -o "$tools/SHA256SUMS" "$base/SHA256SUMS"
          curl -fsSL --retry 3 --retry-delay 2 -o "$tools/$RUSTFS_ASSET" "$base/$RUSTFS_ASSET"
          expected="$(awk -v f="$RUSTFS_ASSET" '$2 == f { print $1 }' "$tools/SHA256SUMS")"
          if [ -z "$expected" ]; then
            echo "::error::SHA256SUMS has no entry for $RUSTFS_ASSET" >&2
            exit 1
          fi
          actual="$(sha256sum "$tools/$RUSTFS_ASSET" | awk '{ print $1 }')"
          if [ "$actual" != "$expected" ]; then
            echo "::error::rustfs checksum mismatch: expected $expected, got $actual" >&2
            exit 1
          fi
          echo "checksum verified ($actual)"
          unzip -q "$tools/$RUSTFS_ASSET" -d "$tools/extract"
          binary="$(find "$tools/extract" -type f -name rustfs -print -quit)"
          if [ -z "$binary" ]; then
            echo "::error::rustfs binary not found in $RUSTFS_ASSET" >&2
            exit 1
          fi
          chmod +x "$binary"

          echo "== starting rustfs =="
          # Same flag shape as scripts/sync-s3-test.ps1.
          "$binary" server \
            --address 127.0.0.1:9000 \
            --access-key "$CLIPBOARD_S3_TEST_ACCESS_KEY" \
            --secret-key "$CLIPBOARD_S3_TEST_SECRET_KEY" \
            --region "$CLIPBOARD_S3_TEST_REGION" \
            "$data" >"$server_log" 2>&1 &
          server_pid=$!
          healthy=""
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null 2>&1; then
              healthy="yes"
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "::error::rustfs exited during startup" >&2
              break
            fi
            sleep 1
          done
          if [ -z "$healthy" ]; then
            echo "::error::rustfs did not become healthy on 127.0.0.1:9000" >&2
            tail -n 20 "$server_log" >&2 || true
            exit 1
          fi
          echo "rustfs healthy after ${attempt}s"
          echo "running cargo" >>"$smoke_log"

          run_smoke() {
            local label="$1" filter="$2" log
            log="$(mktemp)"
            echo "== $label =="
            # Output goes to the log file first and is printed afterwards:
            # piping through `tee` would race the guards below. Same flag
            # recipe as the local script: --ignored --nocapture
            # --test-threads=1.
            cargo test --profile ci --manifest-path src-tauri/Cargo.toml \
              --workspace -- --ignored --nocapture --test-threads=1 "$filter" \
              >"$log" 2>&1 || status=1
            cat "$log"
            # Keep a stable copy for the diagnostic status step below.
            tee -a "$RUNNER_TEMP/rustfs-smoke.log" <"$log" >/dev/null
            # Guard 1: the smoke module skips quietly when the endpoint
            # contract breaks, which would otherwise look like a pass.
            if grep -q "\[sync-smoke\] skipped" "$log"; then
              echo "::error::$label silently skipped the real server" >&2
              status=1
            fi
            # Guard 2: a filter that matches nothing also exits 0.
            if ! grep -qE "test result: ok\. [1-9]" "$log"; then
              echo "::error::$label executed no test" >&2
              status=1
            fi
          }
          run_smoke "sync v1 engine smokes" "s3_smoke"
          run_smoke "clipboard-sync transport round trip" "disposable_s3_round_trip"
          run_smoke "clipboard-sync transport edge branches" "disposable_s3_edge_branches"
          run_smoke "clipboard-sync transport connection and streaming" "disposable_s3_connection_and_streaming_paths"
          if [ "$status" -ne 0 ]; then
            echo "::error::real-S3 smoke suite failed" >&2
            exit 1
          fi
          echo "real-S3 smoke suite passed"

      # The maintainer may not be able to open the Actions web log from every
      # environment. This mirrors a short failure fingerprint into a commit
      # status, which the public statuses API exposes without authentication.
      # It is diagnostic only; the full output lives in the job log.
      - name: Surface server failure fingerprint
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          server_log="$RUNNER_TEMP/rustfs-server.log"
          smoke_log="$RUNNER_TEMP/rustfs-smoke.log"
          fingerprint="no server log"
          # Failure detail, most informative first: a compile error outranks a
          # broken environment contract, which outranks a failing test name.
          detail=""
          if grep -q "running cargo" "$smoke_log" 2>/dev/null; then
            detail="$(grep -m1 -E 'error\[|^error:' "$smoke_log" | cut -c1-90 || true)"
            if [ -z "$detail" ]; then
              skip="$(grep -m1 '\[sync-smoke\] skipped' "$smoke_log" | cut -c1-90 || true)"
              if [ -n "$skip" ]; then
                detail="$skip"
              fi
            fi
            if [ -z "$detail" ]; then
              failing_test="$(sed -n '/^failures:$/{n;p;}' "$smoke_log" | head -n1 | sed 's/^ *//' || true)"
              if [ -n "$failing_test" ]; then
                detail="test failed: $failing_test"
              fi
            fi
            if [ -z "$detail" ]; then
              summary_line="$(grep -m1 'test result: FAILED' "$smoke_log" | cut -c1-90 || true)"
              if [ -n "$summary_line" ]; then
                detail="$summary_line"
              fi
            fi
          else
            detail="failed before cargo (provisioning or server startup)"
          fi
          if [ -n "$detail" ]; then
            fingerprint="$detail"
          elif [ -f "$server_log" ]; then
            fingerprint="rustfs: $(tail -n 3 "$server_log" | tr '\n' ' ' | cut -c1-80)"
          fi
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=failure \
            -f context=sync-s3-smoke-diagnostics \
            -f description="$fingerprint" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            >/dev/null
          echo "fingerprint: $fingerprint"
