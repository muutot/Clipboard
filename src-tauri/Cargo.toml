[package]
name = "clipboard-desktop"
version = "1.2.0"
description = "A high-performance cross-platform clipboard manager"
authors = []
edition = "2021"
license = "AGPL-3.0-only"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "clipboard_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
tantivy = "0.26.1"
regex-lite = "0.1"
base64 = "0.23"
sha2 = "0.11"
md-5 = "0.11"
urlencoding = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
ctrlc = "3"
open = "5"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
window-vibrancy = "0.6"
oar-ocr = { version = "0.8", features = ["download-binaries", "auto-download"] }
reqwest = { version = "0.13", default-features = false, features = ["stream", "rustls"] }
tokio = { version = "1", features = ["fs", "io-util"] }
ort = "=2.0.0-rc.12"
hex = "0.4.3"
zip = "2"
