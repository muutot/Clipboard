[package]
name = "clipboard-desktop"
version = "1.4.0"
description = "A high-performance cross-platform clipboard manager"
authors = []
edition = "2021"
license = "AGPL-3.0-only"

[workspace]
members = ["crates/clipboard-sync"]
resolver = "2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "clipboard_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }


[dependencies]
clipboard-sync = { path = "crates/clipboard-sync" }
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
tantivy = "0.26.1"
regex-lite = "0.1"
base64 = "0.23"
sha2 = "0.10"
md-5 = "0.10"
urlencoding = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
ctrlc = "3"
open = "5"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
window-vibrancy = "0.6"
oar-ocr = { version = "0.8", features = ["download-binaries", "auto-download"] }
reqwest = { version = "0.13", default-features = false, features = ["stream", "rustls", "blocking"] }
tokio = { version = "1", features = ["fs", "io-util"] }
ort = "=2.0.0-rc.12"
hex = "0.4.3"
zip = "2"
walkdir = "2"
chrono = "0.4"
rand = "0.9"
uuid = { version = "1", features = ["v4"] }
bincode = { version = "2", features = ["serde"] }

[dev-dependencies]
clipboard-sync = { path = "crates/clipboard-sync", features = ["engine-test-support"] }

# Dev-profile tuning for the fastest possible local `tauri dev` builds:
# - dependencies stay unoptimized (opt-level 0) with no debug symbols, so the
#   existing cached artifacts are reused and compile/link is as fast as possible.
# - unpacked split debug info keeps MSVC PDB handling fast (local crate only).
[profile.dev]
incremental = true
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 0
debug = false

# CI profile: same debug symbols as dev, but dependencies stay at opt-level 0
# so clippy/test runs compile as fast as possible in GitHub Actions.
[profile.ci]
inherits = "dev"

[profile.ci.package."*"]
opt-level = 0

# Release profile for local `tauri build`: like dev, extreme build speed with
# minimal storage. No debug info, no incremental cache, unoptimized objects.
# The GitHub Actions release job overrides these via CARGO_PROFILE_RELEASE_*
# env vars to enable extreme runtime optimization (see release.yml).
[profile.release]
opt-level = 0
codegen-units = 256
panic = "abort"
strip = true
debug = false
incremental = false
