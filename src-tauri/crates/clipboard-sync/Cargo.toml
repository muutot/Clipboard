[package]
name = "clipboard-sync"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "S3-first synchronization protocol and transport for Clipboard Desktop"

[features]
engine-test-support = []

[dependencies]
aes-gcm = "0.10"
base64 = "0.23"
bincode = { version = "2", features = ["serde"] }
chrono = "0.4"
hex = "0.4.3"
hmac = "0.12"
md-5 = "0.10"
pbkdf2 = "0.11"
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["stream", "rustls", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
zstd = "0.13"
