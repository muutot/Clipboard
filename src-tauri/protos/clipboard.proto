// Documentation-only schema for the Clipboard Desktop sync wire format.
//
// IMPORTANT: The actual on-wire encoding is bincode v2 (`bincode::Encode`/
// `bincode::Decode` in `src-tauri/src/sync/proto.rs`), NOT protobuf. This file
// is a human-readable sketch written in proto3 syntax so the field set stays
// reviewable; nothing at runtime reads it. Treat `src-tauri/src/sync/proto.rs`
// and the tests there as authoritative.
//
// Because bincode is a positional encoding (no field names or tags), the
// declaration order and types below must exactly match the Rust structs:
//   - `ClipboardItem`        -> `src-tauri/src/domain/clipboard_item.rs`
//   - `SyncChangeLogEntry`   -> `src-tauri/src/storage/pool.rs`
//   - `Baseline`/`Oplog`/`OplogResource`/`OplogV2` -> `src-tauri/src/sync/proto.rs`
//   - `ClipboardKind`        -> `src-tauri/src/domain/clipboard_item.rs`
// Field numbers 1..N are documentation tags only; they are not serialized.
//
// Evolution rules: append new fields at the end as `optional`, never reorder,
// and introduce a new envelope version (e.g. `OplogV3`) with newest-first
// decode fallback. All clients must upgrade together; bincode cannot skip
// unknown fields. See data-contracts.md "Sync wire-format evolution rules".
syntax = "proto3";
package clipboard;

enum Kind {
    TEXT = 0;
    LINK = 1;
    IMAGE = 2;
    FILE = 3;
}

message ClipboardItem {
    string id = 1;
    Kind kind = 2;
    string title = 3;
    optional string text_content = 4;
    optional string html_content = 5;
    optional string rtf_content = 6;
    optional string resource_path = 7;
    optional string preview_path = 8;
    string content_hash = 9;
    optional string source_app = 10;
    optional string icon_path = 11;
    uint64 size_bytes = 12;
    int64 created_at_ms = 13;
    optional int64 last_used_at_ms = 14;
    bool is_favorite = 15;
    optional string metadata_json = 16;
}

message Baseline {
    uint32 format_version = 1;  // always 1 today; bump on layout change
    int64 created_at_ms = 2;
    string device_id = 3;
    string app_version = 4;     // CARGO_PKG_VERSION at write time
    repeated ClipboardItem items = 5;
}

message OplogEntry {
    int64 sequence = 1;
    string item_id = 2;
    string operation = 3;   // insert / update / delete
    string kind = 4;        // textual kind string (text/link/image/file)
    string title = 5;
    string content_hash = 6;
    optional string resource_path = 7;
    optional string preview_path = 8;
    optional string icon_path = 9;
    optional string text_content = 10;
    optional string html_content = 11;
    optional string rtf_content = 12;
    optional string metadata_json = 13;
    bool is_favorite = 14;
    optional string source_app = 15;
    int64 size_bytes = 16;
    optional int64 last_used_at_ms = 17;
    int64 created_at_ms = 18;
    int64 modified_at_ms = 19;
    string device_id = 20;  // source device
}

message OplogResource {
    // Portable `category/relative` path (image/, file/, preview/, icon/).
    string rel_path = 1;
    bytes bytes = 2;
}

// Legacy envelope, entries only. Written before inline resources shipped;
// kept solely so `deserialize_oplog_with_resources` can decode old files
// (V1 fallback). New writers always emit OplogV2.
message Oplog {
    repeated OplogEntry entries = 1;
}

// Current envelope: entries plus inline resource bytes so receivers can
// materialize images/files/previews/icons regardless of their local storage
// layout, then apply_remote_oplog.
message OplogV2 {
    repeated OplogEntry entries = 1;
    repeated OplogResource resources = 2;
}
