<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#151515" />
    <style>
      :root {
        --bg-app: #111111;
        --bg-settings: #1b1b1b;
        --font-size-base: 14px;
        --font-size-secondary: 11px;
        --font-size-tiny: 10px;
        --font-size-cardTitle: 13px;
        --font-size-cardPreview: 11px;
        font-size: 14px;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: color-mix(in srgb, var(--bg-app) var(--window-opacity-mix, 100%), transparent);
      }
    </style>
    <title>Clipboard</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
